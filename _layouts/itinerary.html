---
layout: default
---

<a class="edit-link" href="https://github.com/Cedric-01/9-day-travel-itinerary-for-JZH/edit/main/{{ page.path }}">编辑此页面</a>
<h1 class="it-title">{{ page.title }}</h1>
<p class="it-dates">{{ page.start_date }}{% if page.end_date %} — {{ page.end_date }}{% endif %}</p>

<div id="map"></div>

<div class="content">
  {{ content }}
</div>

<script>
  (function() {
    if (typeof page === 'undefined') {
      // noop
    }
    try {
      const locations = {{ page.locations | jsonify }};
      if (!locations || locations.length === 0) return;

      const first = locations[0];
      const map = L.map('map').setView([first.lat, first.lng], 10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
      }).addTo(map);

      locations.forEach(l => {
        const marker = L.marker([l.lat, l.lng]).addTo(map);
        const popupHtml = '<strong>' + (l.name||'') + '</strong>' + (l.note ? ('<br>' + l.note) : '');
        marker.bindPopup(popupHtml);
      });

      const bounds = L.latLngBounds(locations.map(l => [l.lat, l.lng]));
      if (locations.length > 1) map.fitBounds(bounds, { padding: [40, 40] });
    } catch (e) {
      // If page.locations is not defined, skip silently
      console.warn('No locations for map or map init failed', e);
    }
  })();
</script>

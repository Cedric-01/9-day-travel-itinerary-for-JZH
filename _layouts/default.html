<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
  <header class="site-header container">
    <div class="site-title">
      <a href="/">{{ site.title }}</a>
    </div>
    <nav class="site-nav">
      <a href="{{ site.github.url | default: 'https://github.com/Cedric-01/9-day-travel-itinerary-for-JZH' }}" target="_blank" rel="noopener">View on GitHub</a>
    </nav>
  </header>

  <main class="container site-main">
    {{ content }}
  </main>

  <footer class="site-footer container">
    <p>{{ site.title }} maintained by <a href="{{ site.github.url | default: 'https://github.com/Cedric-01' }}">{{ site.author | default: 'Cedric-01' }}</a></p>
    <p>Published with <a href="https://pages.github.com/">GitHub Pages</a></p>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
